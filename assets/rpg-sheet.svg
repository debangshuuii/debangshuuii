<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 550" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0e"/>
      <stop offset="50%" stop-color="#140608"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Crimson Neon Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#FF3B30"/>
    </linearGradient>

    <!-- Cyan/Blue Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006677"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Amber XP Gradient -->
    <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Green Quest Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FF3B30" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Courier New', 'Fira Code', 'DejaVu Sans Mono', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    .label { fill: #8B949E; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 600; }
    .val { fill: #FFFFFF; font-size: 13px; font-weight: 600; }
    .accent { fill: #FF3B30; }
    .hud-bracket { stroke: #FF3B30; stroke-width: 2; fill: none; }
    .bar-bg { fill: #1B1B22; rx: 3.5px; }
  </style>

  <!-- Base Card Background -->
  <rect x="5" y="5" width="850" height="540" rx="14" fill="url(#bgGrad)" stroke="#380a0e" stroke-width="1.5"/>
  <rect x="5" y="5" width="850" height="540" rx="14" fill="url(#grid)"/>

  <!-- Futuristic Corner HUD Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" class="hud-bracket" filter="url(#neonGlow)"/>
  <path d="M 840 40 L 840 20 L 820 20" class="hud-bracket" filter="url(#neonGlow)"/>
  <path d="M 20 510 L 20 530 L 40 530" class="hud-bracket" filter="url(#neonGlow)"/>
  <path d="M 840 510 L 840 530 L 820 530" class="hud-bracket" filter="url(#neonGlow)"/>

  <!-- ================= TOP HUD HEADER BAR ================= -->
  <g transform="translate(35, 25)">
    <circle cx="6" cy="10" r="4" fill="#FF3B30" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="14" class="mono label" fill="#FF3B30">CYBER_OPERATOR // DEBANGSHU.EXE</text>
    
    <!-- System Status Tag -->
    <rect x="610" y="0" width="180" height="22" rx="11" fill="#1A0D10" stroke="#FF3B30" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="624" cy="11" r="3.5" fill="#22C55E"/>
    <text x="635" y="15" class="mono" font-size="10.5" fill="#E2E8F0" letter-spacing="1">STATUS: OVERCLOCKED</text>
  </g>

  <!-- Divider Line -->
  <line x1="35" y1="58" x2="825" y2="58" stroke="url(#redGrad)" stroke-width="1" stroke-opacity="0.6"/>

  <!-- ================= TIER 1: HERO IDENTITY ROW (FULL WIDTH) ================= -->
  <g transform="translate(40, 75)">
    <!-- Avatar / Crest Frame -->
    <polygon points="10,0 65,0 75,10 75,65 65,75 10,75 0,65 0,10" fill="#150608" stroke="#FF3B30" stroke-width="1.5" filter="url(#neonGlow)"/>
    <text x="37" y="48" class="mono" font-size="30" fill="#FF3B30" text-anchor="middle">⚡</text>

    <!-- Name & Details -->
    <g transform="translate(95, 8)">
      <text x="0" y="18" class="sans" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Debangshu Sinha</text>
      <text x="0" y="38" class="mono" font-size="12" fill="#FF3B30" font-weight="700" letter-spacing="1">CLASS: FRONTEND ALCHEMIST &amp; 3D WEAVER</text>
      <text x="0" y="55" class="mono label" font-size="10.5" fill="#8B949E">FOCUS: INTERACTIVE UI • BLENDER 3D • REACT &amp; TAILWIND</text>
    </g>

    <!-- Level Crest (Top Right) -->
    <g transform="translate(680, 5)">
      <polygon points="10,0 80,0 90,10 90,55 80,65 10,65 0,55 0,10" fill="#140608" stroke="#8B0000" stroke-width="1.5"/>
      <text x="45" y="24" class="mono label" font-size="9" fill="#8B949E" text-anchor="middle">OPERATOR</text>
      <text x="45" y="50" class="mono" font-size="22" font-weight="900" fill="#FF3B30" text-anchor="middle" filter="url(#neonGlow)">LVL 01</text>
    </g>
  </g>

  <!-- Horizontal Divider Between Tier 1 and Tier 2 -->
  <line x1="35" y1="168" x2="825" y2="168" stroke="#8B0000" stroke-width="1" stroke-opacity="0.35"/>

  <!-- ================= TIER 2: TWO COLUMNS (VITALS & ATTRIBUTES) ================= -->

  <!-- ===== LEFT COLUMN: VITALS & POWER ===== -->
  <g transform="translate(40, 185)">
    <text x="0" y="12" class="mono label" fill="#FF3B30">⚡ VITALS &amp; ENERGY METRICS</text>

    <!-- HP Gauge -->
    <g transform="translate(0, 32)">
      <text x="0" y="12" class="mono label">HP [Vitality &amp; Drive]</text>
      <text x="350" y="12" class="mono val accent" text-anchor="end">100 / 100</text>
      <rect x="0" y="20" width="350" height="9" rx="4.5" class="bar-bg"/>
      <rect x="0" y="20" width="350" height="9" rx="4.5" fill="url(#redGrad)" filter="url(#neonGlow)"/>
    </g>

    <!-- MP Gauge -->
    <g transform="translate(0, 85)">
      <text x="0" y="12" class="mono label">MP [Creative Energy]</text>
      <text x="350" y="12" class="mono val" fill="#00E5FF" text-anchor="end">95 / 100</text>
      <rect x="0" y="20" width="350" height="9" rx="4.5" class="bar-bg"/>
      <rect x="0" y="20" width="332" height="9" rx="4.5" fill="url(#cyanGrad)"/>
    </g>

    <!-- EXP Gauge -->
    <g transform="translate(0, 138)">
      <text x="0" y="12" class="mono label">EXP [Level Progression]</text>
      <text x="350" y="12" class="mono val" fill="#F59E0B" text-anchor="end">76%</text>
      <rect x="0" y="20" width="350" height="9" rx="4.5" class="bar-bg"/>
      <rect x="0" y="20" width="266" height="9" rx="4.5" fill="url(#xpGrad)"/>
    </g>
  </g>

  <!-- Vertical Divider Separating Columns -->
  <line x1="425" y1="180" x2="425" y2="385" stroke="#8B0000" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>

  <!-- ===== RIGHT COLUMN: COMBAT ATTRIBUTES ===== -->
  <g transform="translate(455, 185)">
    <text x="0" y="12" class="mono label" fill="#FF3B30">⚔️ COMBAT ATTRIBUTES // STATS</text>

    <!-- STAT 1: INT / Frontend -->
    <g transform="translate(0, 26)">
      <text x="0" y="12" class="mono val" font-size="12">INT // Frontend Crafting</text>
      <text x="370" y="12" class="mono val accent" font-size="12" text-anchor="end">88 <tspan font-size="10" fill="#8B949E">/ 100</tspan></text>
      <rect x="0" y="18" width="370" height="7" rx="3.5" class="bar-bg"/>
      <rect x="0" y="18" width="325" height="7" rx="3.5" fill="url(#redGrad)"/>
      <text x="0" y="36" class="mono" font-size="9" fill="#8B949E">React • JavaScript • Tailwind CSS</text>
    </g>

    <!-- STAT 2: DEX / 3D -->
    <g transform="translate(0, 74)">
      <text x="0" y="12" class="mono val" font-size="12">DEX // 3D Spatial Geometry</text>
      <text x="370" y="12" class="mono val accent" font-size="12" text-anchor="end">70 <tspan font-size="10" fill="#8B949E">/ 100</tspan></text>
      <rect x="0" y="18" width="370" height="7" rx="3.5" class="bar-bg"/>
      <rect x="0" y="18" width="259" height="7" rx="3.5" fill="url(#redGrad)"/>
      <text x="0" y="36" class="mono" font-size="9" fill="#8B949E">Blender 3D • Modeling • Lighting</text>
    </g>

    <!-- STAT 3: PER / UX -->
    <g transform="translate(0, 122)">
      <text x="0" y="12" class="mono val" font-size="12">PER // Visual Experience (UX)</text>
      <text x="370" y="12" class="mono val accent" font-size="12" text-anchor="end">82 <tspan font-size="10" fill="#8B949E">/ 100</tspan></text>
      <rect x="0" y="18" width="370" height="7" rx="3.5" class="bar-bg"/>
      <rect x="0" y="18" width="303" height="7" rx="3.5" fill="url(#redGrad)"/>
      <text x="0" y="36" class="mono" font-size="9" fill="#8B949E">Figma Prototyping • Micro-interactions</text>
    </g>

    <!-- STAT 4: RES / Debugging -->
    <g transform="translate(0, 170)">
      <text x="0" y="12" class="mono val" font-size="12">RES // Debugging Resilience</text>
      <text x="370" y="12" class="mono val accent" font-size="12" text-anchor="end">94 <tspan font-size="10" fill="#8B949E">/ 100</tspan></text>
      <rect x="0" y="18" width="370" height="7" rx="3.5" class="bar-bg"/>
      <rect x="0" y="18" width="347" height="7" rx="3.5" fill="url(#redGrad)"/>
      <text x="0" y="36" class="mono" font-size="9" fill="#8B949E">Problem Solving • Git Version Control</text>
    </g>
  </g>

  <!-- ================= TIER 3: BOTTOM HUD (QUEST & ARSENAL) ================= -->
  <g transform="translate(35, 410)">
    <rect x="0" y="0" width="790" height="105" rx="8" fill="#100507" stroke="#8B0000" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Left Box: Active Quest -->
    <g transform="translate(20, 16)">
      <text x="0" y="12" class="mono label" fill="#FF3B30">⚔️ ACTIVE MAIN QUEST</text>
      <text x="0" y="34" class="sans" font-size="13" font-weight="700" fill="#F0F6FC">"Craft next-gen interactive 3D web interfaces &amp; conquer React."</text>
      <text x="0" y="54" class="mono" font-size="10" fill="#8B949E">REWARD: +500 XP • Senior Web Artisan Title • Unlocked 3D Portfolio</text>
      
      <!-- Vector Progress Bar for Quest -->
      <g transform="translate(0, 64)">
        <text x="0" y="9" class="mono" font-size="9.5" fill="#22C55E">PROGRESS [65%]:</text>
        <rect x="110" y="0" width="220" height="9" rx="4.5" class="bar-bg"/>
        <rect x="110" y="0" width="143" height="9" rx="4.5" fill="url(#greenGrad)"/>
      </g>
    </g>

    <!-- Vertical Divider in Bottom Box -->
    <line x1="510" y1="12" x2="510" y2="92" stroke="#8B0000" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Right Box: Equipped Arsenal -->
    <g transform="translate(530, 16)">
      <text x="0" y="12" class="mono label" fill="#FF3B30">🎒 EQUIPPED ARSENAL</text>
      <g transform="translate(0, 26)">
        <text x="0" y="12" class="mono" font-size="11" fill="#E2E8F0">🗡️ <tspan fill="#8B949E">Primary:</tspan> VS Code [Dark Mode]</text>
        <text x="0" y="30" class="mono" font-size="11" fill="#E2E8F0">🛡️ <tspan fill="#8B949E">Shield:</tspan> React &amp; Tailwind</text>
        <text x="0" y="48" class="mono" font-size="11" fill="#E2E8F0">🔮 <tspan fill="#8B949E">Catalyst:</tspan> Blender 3D Engine</text>
      </g>
    </g>
  </g>
</svg>
