<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0e"/>
      <stop offset="50%" stop-color="#140608"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Crimson Neon Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#FF3B30"/>
    </linearGradient>

    <!-- Cyan/Blue Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006677"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Amber XP Gradient -->
    <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FF3B30" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    .label { fill: #8B949E; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
    .val { fill: #FFFFFF; font-size: 13px; font-weight: 600; }
    .accent { fill: #FF3B30; }
    .hud-bracket { stroke: #FF3B30; stroke-width: 2; fill: none; }
    .card-border { stroke: #8B0000; stroke-width: 1.5; stroke-opacity: 0.6; fill: none; }
    .bar-bg { fill: #1B1B22; rx: 4px; }
  </style>

  <!-- Base Card Background -->
  <rect x="5" y="5" width="840" height="500" rx="14" fill="url(#bgGrad)" stroke="#380a0e" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="500" rx="14" fill="url(#grid)"/>

  <!-- Futuristic Corner HUD Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" class="hud-bracket" filter="url(#neonGlow)"/>
  <path d="M 830 40 L 830 20 L 810 20" class="hud-bracket" filter="url(#neonGlow)"/>
  <path d="M 20 470 L 20 490 L 40 490" class="hud-bracket" filter="url(#neonGlow)"/>
  <path d="M 830 470 L 830 490 L 810 490" class="hud-bracket" filter="url(#neonGlow)"/>

  <!-- ================= TOP HUD BAR ================= -->
  <g transform="translate(35, 30)">
    <circle cx="6" cy="6" r="4" fill="#FF3B30" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="10" class="mono label" fill="#FF3B30">CYBER_OPERATOR // DEBANGSHU.EXE</text>
    
    <!-- System Status Tag -->
    <rect x="590" y="-3" width="180" height="20" rx="10" fill="#1A0D10" stroke="#FF3B30" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="604" cy="7" r="3" fill="#22C55E"/>
    <text x="614" y="11" class="mono" font-size="10" fill="#E2E8F0" letter-spacing="1">STATUS: OVERCLOCKED</text>
  </g>

  <!-- Divider Line -->
  <line x1="35" y1="58" x2="815" y2="58" stroke="url(#redGrad)" stroke-width="1" stroke-opacity="0.7"/>

  <!-- ================= CHARACTER IDENTITY (LEFT COLUMN) ================= -->
  <g transform="translate(40, 85)">
    <!-- Avatar / Crest Frame -->
    <polygon points="12,0 90,0 102,12 102,90 90,102 12,102 0,90 0,12" fill="#150608" stroke="#FF3B30" stroke-width="1.5" filter="url(#neonGlow)"/>
    <text x="51" y="60" class="mono" font-size="34" fill="#FF3B30" text-anchor="middle">⚡</text>
    <rect x="26" y="80" width="50" height="14" rx="3" fill="#FF3B30"/>
    <text x="51" y="91" class="mono" font-size="9" fill="#000" font-weight="900" text-anchor="middle">LVL 01</text>

    <!-- Name & Archetype -->
    <g transform="translate(120, 15)">
      <text x="0" y="20" class="sans" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Debangshu Sinha</text>
      <text x="0" y="42" class="mono" font-size="12" fill="#FF3B30" font-weight="700" letter-spacing="1">CLASS: FRONTEND ALCHEMIST &amp; 3D WEAVER</text>
      <text x="0" y="60" class="mono label" font-size="10">ALIGNMENT: CREATIVE CHAOTIC • WEB GUILD</text>
    </g>
  </g>

  <!-- ================= VITALS / ENERGY GAUGES ================= -->
  <g transform="translate(40, 215)">
    <!-- HP Gauge -->
    <text x="0" y="14" class="mono label">HP (Vitality &amp; Drive)</text>
    <text x="320" y="14" class="mono val accent" text-anchor="end">100 / 100</text>
    <rect x="0" y="22" width="320" height="10" rx="4" class="bar-bg"/>
    <rect x="0" y="22" width="320" height="10" rx="4" fill="url(#redGrad)" filter="url(#neonGlow)"/>

    <!-- MP Gauge -->
    <text x="0" y="54" class="mono label">MP (Creative Energy)</text>
    <text x="320" y="54" class="mono val" fill="#00E5FF" text-anchor="end">95 / 100</text>
    <rect x="0" y="62" width="320" height="10" rx="4" class="bar-bg"/>
    <rect x="0" y="62" width="304" height="10" rx="4" fill="url(#cyanGrad)"/>

    <!-- XP Gauge -->
    <text x="0" y="94" class="mono label">EXP (Growth to Next Level)</text>
    <text x="320" y="94" class="mono val" fill="#F59E0B" text-anchor="end">76%</text>
    <rect x="0" y="102" width="320" height="10" rx="4" class="bar-bg"/>
    <rect x="0" y="102" width="243" height="10" rx="4" fill="url(#xpGrad)"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="400" y1="90" x2="400" y2="340" stroke="#8B0000" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>

  <!-- ================= ATTRIBUTES MATRIX (RIGHT COLUMN) ================= -->
  <g transform="translate(435, 95)">
    <text x="0" y="10" class="mono label" fill="#FF3B30">CORE ATTRIBUTES // COMBAT STATS</text>

    <!-- STAT 1: Coding -->
    <g transform="translate(0, 28)">
      <text x="0" y="14" class="mono val">INT // Frontend Crafting</text>
      <text x="360" y="14" class="mono val accent" text-anchor="end">88 <tspan font-size="10" fill="#8B949E">/ 100</tspan></text>
      <rect x="0" y="20" width="360" height="7" rx="3.5" class="bar-bg"/>
      <rect x="0" y="20" width="316" height="7" rx="3.5" fill="url(#redGrad)"/>
      <text x="0" y="38" class="mono" font-size="9.5" fill="#6E7681">React • JavaScript • Tailwind CSS • Responsive UI</text>
    </g>

    <!-- STAT 2: 3D Dimension -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" class="mono val">DEX // 3D Spatial Geometry</text>
      <text x="360" y="14" class="mono val accent" text-anchor="end">70 <tspan font-size="10" fill="#8B949E">/ 100</tspan></text>
      <rect x="0" y="20" width="360" height="7" rx="3.5" class="bar-bg"/>
      <rect x="0" y="20" width="252" height="7" rx="3.5" fill="url(#redGrad)"/>
      <text x="0" y="38" class="mono" font-size="9.5" fill="#6E7681">Blender 3D • Modeling • Lighting • Scene Design</text>
    </g>

    <!-- STAT 3: Visual UX -->
    <g transform="translate(0, 132)">
      <text x="0" y="14" class="mono val">PER // Visual Experience (UX)</text>
      <text x="360" y="14" class="mono val accent" text-anchor="end">82 <tspan font-size="10" fill="#8B949E">/ 100</tspan></text>
      <rect x="0" y="20" width="360" height="7" rx="3.5" class="bar-bg"/>
      <rect x="0" y="20" width="295" height="7" rx="3.5" fill="url(#redGrad)"/>
      <text x="0" y="38" class="mono" font-size="9.5" fill="#6E7681">Figma Prototyping • Micro-interactions • Aesthetics</text>
    </g>

    <!-- STAT 4: Bug Resilience -->
    <g transform="translate(0, 184)">
      <text x="0" y="14" class="mono val">RES // Debugging Resilience</text>
      <text x="360" y="14" class="mono val accent" text-anchor="end">94 <tspan font-size="10" fill="#8B949E">/ 100</tspan></text>
      <rect x="0" y="20" width="360" height="7" rx="3.5" class="bar-bg"/>
      <rect x="0" y="20" width="338" height="7" rx="3.5" fill="url(#redGrad)"/>
      <text x="0" y="38" class="mono" font-size="9.5" fill="#6E7681">Problem Solving • Git Version Control • Persistence</text>
    </g>
  </g>

  <!-- ================= BOTTOM HUD: QUEST & INVENTORY ================= -->
  <g transform="translate(35, 365)">
    <!-- Card Frame for Bottom -->
    <rect x="0" y="0" width="780" height="105" rx="8" fill="#100507" stroke="#8B0000" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Left Box: Active Quest -->
    <g transform="translate(20, 18)">
      <text x="0" y="12" class="mono label" fill="#FF3B30">⚔️ ACTIVE MAIN QUEST</text>
      <text x="0" y="34" class="sans" font-size="13.5" font-weight="600" fill="#F0F6FC">"Craft next-gen interactive 3D web interfaces &amp; conquer React."</text>
      <text x="0" y="55" class="mono" font-size="10.5" fill="#8B949E">REWARD: +500 XP • Senior Web Artisan Title • Unlocked 3D Portfolio</text>
      <text x="0" y="73" class="mono" font-size="10" fill="#22C55E">PROGRESS: ████████████░░░░░░ 65%</text>
    </g>

    <!-- Right Box: Equipped Inventory -->
    <g transform="translate(480, 18)">
      <text x="0" y="12" class="mono label" fill="#FF3B30">🎒 EQUIPPED ARSENAL</text>
      <g transform="translate(0, 26)">
        <text x="0" y="12" class="mono" font-size="11" fill="#E2E8F0">🗡️ <tspan fill="#8B949E">Primary:</tspan> VS Code [Dark Theme]</text>
        <text x="0" y="30" class="mono" font-size="11" fill="#E2E8F0">🛡️ <tspan fill="#8B949E">Shield:</tspan> React &amp; Tailwind</text>
        <text x="0" y="48" class="mono" font-size="11" fill="#E2E8F0">🔮 <tspan fill="#8B949E">Catalyst:</tspan> Blender 3D Engine</text>
      </g>
    </g>
  </g>
</svg>
